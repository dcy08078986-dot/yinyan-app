<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>难以忘怀 · 引言</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: #111;
        background: #f8f8f8;
        line-height: 1.7;
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 28px 16px 56px;
      }

      .hero {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 16px;
        padding: 28px 22px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 30px;
        letter-spacing: 1px;
      }

      .subtitle {
        margin: 0;
        color: #555;
        font-size: 16px;
      }

      .section {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 20px;
      }

      h2 {
        margin-top: 0;
        font-size: 22px;
      }

      ul {
        margin: 10px 0 0;
        padding-left: 18px;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .gallery img {
        width: 100%;
        height: 320px;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid #ddd;
        background: #fff;
      }

      .footer {
        color: #666;
        font-size: 14px;
        text-align: center;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="hero">
        <h1>难以忘怀</h1>
        <p class="subtitle">一款专注“引言记录与回味”的本地应用，帮助你收集、整理并重读那些打动你的句子。</p>
      </section>

      <section class="section">
        <h2>应用介绍</h2>
        <p>
          在阅读、观影或日常生活中，我们常会遇到一句让人停下来的话。
          「难以忘怀」把这些瞬间留在你的设备中：你可以手动记录，也可以通过 OCR 从图片中提取文字，
          并按自己的节奏反复回看。
        </p>
      </section>

      <section class="section">
        <h2>核心体验</h2>
        <ul>
          <li>本地保存引言与卡片图片，专注私密、轻量与稳定。</li>
          <li>支持 OCR 识别与框选区域识别，快速提取想要的文字。</li>
          <li>简洁黑白风格，聚焦内容本身，不打断阅读。</li>
        </ul>
      </section>

      <section class="section">
        <h2>页面预览</h2>
        <div class="gallery">
          <img src="images/1.jpg" alt="应用截图 1" />
          <img src="images/2.jpg" alt="应用截图 2" />
          <img src="images/3.jpg" alt="应用截图 3" />
          <img src="images/4.jpg" alt="应用截图 4" />
        </div>
      </section>

      <p class="footer">© 2026 难以忘怀 · Quote App</p>
    </main>
  </body>
</html>
